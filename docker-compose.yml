# Local development services. Values come from the root `.env`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - ojo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional egress through Cloudflare WARP (free): some networks cannot reach the Migraciones
  # site directly. Start with `docker compose --profile proxy up -d warp`, then set
  # MIGRACIONES_PROXY=socks5h://127.0.0.1:1080 in .env. Only requests to Migraciones use it.
  warp:
    image: caomingjun/warp@sha256:3bb9768a3cf0025aa93be7f83072771323afa9bbe8f3a8a95ffd0cb7ab9f1701
    profiles: ["proxy"]
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "0"
      net.ipv4.conf.all.src_valid_mark: "1"
    ports:
      - "127.0.0.1:${WARP_PORT:-1080}:1080"
    volumes:
      - ojo_warp:/var/lib/cloudflare-warp

volumes:
  ojo_pgdata:
  ojo_warp:
